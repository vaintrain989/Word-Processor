<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />

  <title>Word Processor PWA</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f7f7f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      overflow-x: auto;
      white-space: nowrap;
    }

    #editor {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fff;
      outline: none;
    }

    #editor:focus {
      outline: none;
    }
  </style>
</head>

<body>

<div id="toolbar">
  <button onclick="document.execCommand('bold')">
    <span class="material-icons">format_bold</span>
  </button>

  <button onclick="document.execCommand('italic')">
    <span class="material-icons">format_italic</span>
  </button>

  <button onclick="document.execCommand('underline')">
    <span class="material-icons">format_underlined</span>
  </button>

  <button onclick="document.execCommand('formatBlock', false, 'h1')">
    <span class="material-icons">title</span>
  </button>

  <button onclick="document.execCommand('formatBlock', false, 'h2')">
    <span class="material-icons">text_fields</span>
  </button>

  <button id="saveVersion">
    <span class="material-icons">save</span>
  </button>

  <button id="exportFile">
    <span class="material-icons">file_download</span>
  </button>

  <button id="importFile">
    <span class="material-icons">file_upload</span>
  </button>
</div>

  <div id="editor" contenteditable="true">
    Start writing…
  </div>

  <script>
    // Install prompt handling
    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log("PWA install available");
    });

    // Service worker registration
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then(() => {
        console.log("Service worker registered");
      });
    }
  </script>

</body>
</html>
