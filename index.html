<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Word Processor PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .preview-body h1 { font-size: 2em; font-weight: bold; margin-bottom: 0.5em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.2em; }
        .preview-body h2 { font-size: 1.5em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
        .preview-body h3 { font-size: 1.25em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
        .preview-body p { margin-bottom: 1em; line-height: 1.6; }
        .preview-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .preview-body ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .preview-body blockquote { border-left: 4px solid #4f46e5; padding-left: 1em; color: #4b5563; font-style: italic; margin-bottom: 1em; }
        .preview-body code { background-color: #f3f4f6; padding: 0.2em 0.4em; border-radius: 0.25rem; font-family: monospace; font-size: 0.9em; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">📝</span>
            <h1 class="text-xl font-bold tracking-tight text-gray-800">MD Word Processor PWA</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="exportBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center shadow-sm">
                📥 Export File
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex flex-1 overflow-hidden">
        <!-- Editor Panel -->
        <section class="w-1/2 flex flex-col border-r border-gray-200 bg-white">
            <div class="bg-gray-50 px-4 py-2 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider flex justify-between items-center">
                <span>Markdown Editor</span>
                <span id="autoSaveStatus" class="text-indigo-600 font-medium">Auto-save ready</span>
            </div>
            <textarea id="editor" class="flex-1 p-6 resize-none focus:outline-none font-mono text-gray-800 text-sm leading-relaxed" placeholder="# Start writing your masterpiece here...

Use standard **Markdown** syntax to format your content. 

## Features:
- Real-time HTML preview
- Auto-save history mechanism
- Completely local first"></textarea>
            <div class="bg-gray-50 px-4 py-2 border-t border-gray-200 text-xs text-gray-500 flex space-x-4">
                <span id="wordCount">0 words</span>
                <span id="charCount">0 characters</span>
            </div>
        </section>

        <!-- Preview Panel -->
        <section class="w-1/4 flex flex-col bg-gray-50">
            <div class="bg-gray-100 px-4 py-2 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Live Preview
            </div>
            <div id="preview" class="flex-1 p-6 overflow-y-auto preview-body bg-white m-4 rounded-xl shadow-inner border border-gray-200"></div>
        </section>

        <!-- History Panel -->
        <section class="w-1/4 flex flex-col border-l border-gray-200 bg-white">
            <div class="bg-gray-50 px-4 py-2 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Version History (Max 30)
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto divide-y divide-gray-100 p-2 space-y-1">
                <p class="text-xs text-gray-400 p-4 text-center italic">No versions recorded yet. Typing triggers automated tiered snapshots.</p>
            </div>
        </section>
    </main>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const exportBtn = document.getElementById('exportBtn');
        const historyList = document.getElementById('historyList');
        const autoSaveStatus = document.getElementById('autoSaveStatus');

        // Init Draft
        if (localStorage.getItem('current_draft')) {
            editor.value = localStorage.getItem('current_draft');
        }

        function updateMetricsAndPreview() {
            const text = editor.value;
            localStorage.setItem('current_draft', text);
            
            // Preview
            preview.innerHTML = marked.parse(text || '*Empty file*');
            
            // Analytics
            const cleanText = text.trim();
            const words = cleanText === '' ? 0 : cleanText.split(/\s+/).length;
            wordCount.textContent = `${words} word${words !== 1 ? 's' : ''}`;
            charCount.textContent = `${text.length} character${text.length !== 1 ? 's' : ''}`;
        }

        editor.addEventListener('input', updateMetricsAndPreview);
        updateMetricsAndPreview();

        // ⏱️ Tiered Auto-Save History Framework
        function getHistory() {
            return JSON.parse(localStorage.getItem('pwa_history') || '[]');
        }

        function saveHistory(history) {
            localStorage.setItem('pwa_history', JSON.stringify(history));
            renderHistory();
        }

        function triggerAutoSave() {
            const content = editor.value;
            if (!content.trim()) return;

            const now = new Date();
            const timestamp = now.getTime();
            const currentHistory = getHistory();

            if (currentHistory.length > 0) {
                const latest = currentHistory[0];
                const timeDiffMins = (timestamp - latest.timestamp) / (1000 * 60);

                // Tiered logic evaluations
                if (timeDiffMins < 1) {
                    // Do not save more than once per minute
                    return;
                }

                // If history spans past 15 mins, look for hourly/daily constraints
                const ageOfOldestMins = (timestamp - currentHistory[currentHistory.length - 1].timestamp) / (1000 * 60);
                
                if (timeDiffMins < 15) {
                    // Accept minute logs freely up to 15 mins
                } else if (timeDiffMins < 60) {
                    // Enforce hourly tier spacing
                    const hoursPassedSinceLatest = (timestamp - latest.timestamp) / (1000 * 60 * 60);
                    if (hoursPassedSinceLatest < 1) return;
                } else {
                    // Enforce daily tier spacing
                    const daysPassedSinceLatest = (timestamp - latest.timestamp) / (1000 * 60 * 60 * 24);
                    if (daysPassedSinceLatest < 1) return;
                }
            }

            // Construct new snapshot
            const newSnapshot = {
                id: crypto.randomUUID ? crypto.randomUUID() : timestamp.toString(),
                timestamp: timestamp,
                timeString: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                dateString: now.toLocaleDateString(),
                content: content
            };

            currentHistory.unshift(newSnapshot);

            // Restrict historical footprint to a strict maximum of 30 items
            if (currentHistory.length > 30) {
                currentHistory.pop();
            }

            saveHistory(currentHistory);
            
            autoSaveStatus.textContent = `Auto-saved at ${newSnapshot.timeString}`;
            setTimeout(() => { autoSaveStatus.textContent = 'Auto-save ready'; }, 3000);
        }

        function renderHistory() {
            const currentHistory = getHistory();
            if (currentHistory.length === 0) {
                historyList.innerHTML = '<p class="text-xs text-gray-400 p-4 text-center italic">No versions recorded yet. Tiered logs kick in every minute.</p>';
                return;
            }

            historyList.innerHTML = currentHistory.map(item => `
                <div class="p-3 hover:bg-gray-50 rounded-lg group transition-colors flex justify-between items-center text-xs">
                    <div class="cursor-pointer flex-1" onclick="restoreVersion('${item.id}')">
                        <p class="font-medium text-gray-700">${item.timeString}</p>
                        <p class="text-gray-400 text-[10px]">${item.dateString} • ${item.content.length} chars</p>
                    </div>
                    <button onclick="restoreVersion('${item.id}')" class="hidden group-hover:block bg-indigo-50 text-indigo-600 px-2 py-1 rounded hover:bg-indigo-100 transition-colors">
                        Restore
                    </button>
                </div>
            `).join('');
        }

        window.restoreVersion = function(id) {
            const currentHistory = getHistory();
            const matched = currentHistory.find(item => item.id === id);
            if (matched && confirm('Are you sure you want to revert to this archived version? Your current state will be updated.')) {
                editor.value = matched.content;
                updateMetricsAndPreview();
            }
        };

        // Initialize historical panel rendering
        renderHistory();

        // Run auto-save loop checks every 30 seconds
        setInterval(triggerAutoSave, 30000);

        // Export Functionality
        exportBtn.addEventListener('click', () => {
            const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `document-${new Date().toISOString().slice(0,10)}.md`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

    <!-- Optional Minimal Service Worker Registration for offline context -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
